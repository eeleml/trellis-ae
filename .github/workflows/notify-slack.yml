name: Notify Slack on push

# Posts a Slack message every time main is updated.
# One-time setup required: add a repo secret named SLACK_WEBHOOK_URL
# (Settings → Secrets and variables → Actions). See README "Updating the team".

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: ver
        run: echo "version=$(jq -r '.version' plugins/trellis-ae/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
          TEXT=$(printf '📦 *trellis-ae* updated to *v%s* by %s\n<%s|%s>' "$VERSION" "$AUTHOR" "$COMMIT_URL" "$FIRST_LINE")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
